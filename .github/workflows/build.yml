name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
  push:
    branches: ['master', 'startos-package']
    paths-ignore: ['*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The HTTP integration test starts the real MCP server, not a mock.
      - run: npm ci --prefix mcp --omit=dev --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python3 scripts/test-release.py
      - run: python3 scripts/github-release.py metadata
      - name: Lint GitHub workflows (including inline shell)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python3 scripts/test-direct-release.py
