name: GitHub Release

on:
  push:
    branches: ['master']
  workflow_dispatch:
    inputs:
      draft_rc:
        description: 'Build a verified unpublished RC for this exact master commit'
        type: boolean
        default: false

permissions: {}
env:
  RELEASE_RC: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_rc && 'true' || 'false' }}

# Never cancel a partial draft or race two releases of the same version.
concurrency:
  group: listmonk-github-release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  preflight:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      build: ${{ steps.begin.outputs.build }}
      release_id: ${{ steps.begin.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: begin
        run: python3 scripts/direct-release.py begin
        env:
          GH_TOKEN: ${{ github.token }}

  native:
    name: native (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.build == 'true' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: aarch64, target: arm, runner: ubuntu-24.04-arm}
          - {arch: x86_64, target: x86, runner: ubuntu-latest}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      # Audited local equivalent of Start9's pinned native BuildMatrix recipe.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev squashfs-tools-ng
      - uses: docker/setup-docker-action@v5
        with:
          version: '29.9.2'
      - uses: docker/setup-buildx-action@v4
      - run: bash scripts/install-release-cli.sh
      - name: Verify real native engines before build
        run: python3 scripts/direct-release.py engines "$ARCH"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Create ephemeral signing identity and workspace
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem
      - run: npm ci
      - name: Build native package with the official make target
        run: make "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: 'true'
          FORMAT_CHECK: 'true'
          RUST_LOG: debug
          RUST_BACKTRACE: '1'
      - name: Verify package and upload directly to the bound draft ID
        run: python3 scripts/direct-release.py native "$ARCH" "$RELEASE_ID"
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [preflight, native]
    if: needs.preflight.outputs.build == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/install-release-cli.sh
      - name: Verify exact-run release bytes and successful native checks before publication
        run: python3 scripts/direct-release.py finish "$RELEASE_ID"
        env:
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
